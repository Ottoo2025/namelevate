<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submission Successful | Namelevate</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .thanks-wrapper {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8faff;
            text-align: center;
            padding: 20px;
        }
        .thanks-card {
            background: white;
            padding: 60px 40px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 21, 41, 0.08);
            max-width: 500px;
            width: 100%;
        }
        .thanks-logo {
            width: 180px; /* Adjust to match your actual logo size */
            margin-bottom: 30px;
            border-radius: 8px;
        }
        .success-icon {
            font-size: 80px;
            color: #28a745; /* Success Green */
            margin-bottom: 20px;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .thanks-card h1 { color: var(--navy); margin-bottom: 15px; }
        .thanks-card p { color: #666; margin-bottom: 30px; line-height: 1.6; }
        .back-home {
            background: var(--orange);
            color: white;
            text-decoration: none;
            padding: 15px 35px;
            border-radius: 50px;
            font-weight: 700;
            display: inline-block;
            transition: 0.3s;
        }
        .back-home:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(255, 107, 0, 0.3); }
    </style>
</head>
<body>

    <div class="thanks-wrapper">
        <div class="thanks-card">
            <img src="IMAGES/logo.png" alt="Namelevate Logo" class="thanks-logo">
            
            <div class="success-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            
            <h1>Submission Received!</h1>
            <p>Thank you for reaching out to <strong>Namelevate Technologies</strong>. We have received your request and will get back to you shortly.</p>
            
            <a href="index.html" class="back-home">Return to Home</a>
        </div>
    </div>

</body>
</html>
